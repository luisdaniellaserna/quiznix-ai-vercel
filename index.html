<!DOCTYPE html>
<html lang="" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/quiznix.ico">
    <link rel="icon" type="image/png" href="/quiznix.png">
    <link rel="apple-touch-icon" href="/quiznix.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiznix AI</title>
    <script>
      try {
        var t = localStorage.getItem('quiznix-theme')
        if (t) document.documentElement.setAttribute('data-theme', t)
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
