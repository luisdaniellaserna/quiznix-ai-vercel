<!doctype html>
<html lang="en" data-theme="arcade">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/mindaura.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/mindaura.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05060b" />
    <meta
      name="description"
      content="MINDaura — a small arcade of mind games: AI-generated quizzes, live group rooms, and the Tower of Hanoi."
    />
    <meta name="application-name" content="MINDaura" />
    <meta name="apple-mobile-web-app-title" content="MINDaura" />
    <title>MINDaura</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Silkscreen:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var t = localStorage.getItem('quiznix-theme')
        if (t) document.documentElement.setAttribute('data-theme', t)
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
